# CI/CD Environment Configuration
# Non-sensitive values only - sensitive values in vars/secrets/

# Application settings
app.name=TCA Server
app.version=1.0.0
app.environment=cicd
spring.profiles.active=local

# Server settings
server.port=8080
server.servlet.context-path=/tca

# Database settings - Test database (credentials in secrets)
spring.datasource.url=jdbc:postgresql://localhost:5432/tca-server-test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging settings
logging.level.root=WARN
logging.level.com.application=DEBUG
logging.file.path=/tmp/logs

# Actuator settings
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Application-specific settings
app.api.timeout=30000
app.api.retry.count=3
app.file.upload.path=/tmp/uploads

# CI/CD specific
server.tomcat.threads.max=25

