# Local Development Environment Configuration
# Non-sensitive values only - sensitive values in vars/secrets/

# Application settings
app.name=TCA Server
app.version=1.0.0
app.environment=local
spring.profiles.active=local

# Server settings
server.port=8080
server.servlet.context-path=/tca

# Database settings - URL ONLY (password in secrets)
spring.datasource.url=jdbc:postgresql://localhost:5432/tca-server-20220114
# Credentials moved to vars/secrets/local-secrets.properties
#spring.datasource.username=postgres
#spring.datasource.password=ps@admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# Logging settings
logging.level.root=INFO
logging.level.com.application=DEBUG
logging.file.path=logs

# Actuator settings
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Application-specific settings
app.api.timeout=30000
app.api.retry.count=3
app.file.upload.path=/tmp/uploads

