# Docker Environment Configuration
# Non-sensitive values only - sensitive values in vars/secrets/

# Application settings
app.name=TCA Server
app.version=1.0.0
app.environment=docker
spring.profiles.active=local

# Server settings
server.port=8080
server.servlet.context-path=/tca

# Database settings - URL with service name (credentials in secrets)
spring.datasource.url=jdbc:postgresql://postgres:5432/tca-server-20220114
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging settings
logging.level.root=INFO
logging.level.com.application=INFO
logging.file.path=/app/logs

# Actuator settings
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Application-specific settings
app.api.timeout=30000
app.api.retry.count=3
app.file.upload.path=/app/uploads

# Docker-specific
server.tomcat.threads.max=50

