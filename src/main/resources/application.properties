# Load environment-specific values from root vars folder (optional)\nspring.config.import=optional:file:./vars/local/values.properties\n# Load git-ignored secrets (optional)\nspring.config.import+=optional:file:./vars/secrets/local-secrets.properties
# ============================================================
# External Configuration
# ============================================================

spring.config.import=optional:file:./vars/local/values.properties,optional:file:./vars/secrets/local-secrets.properties
# ============================================================
# External Configuration
# ============================================================

# Environment-specific configuration
#spring.config.import=optional:file:./vars/local/values.properties
#
## Local secrets (git-ignored)
#spring.config.import+=optional:file:./vars/secrets/local-secrets.properties

spring.application.name=${app.name}
spring.application.version=${app.version}

# Server configuration
server.port=${server.port}
server.servlet.context-path=${server.servlet.context-path}
server.error.include-message=always
server.error.include-stacktrace=on-param

# Database configuration
spring.datasource.url=${spring.datasource.url}
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=${spring.datasource.driver-class-name}
spring.jpa.hibernate.ddl-auto=${spring.jpa.hibernate.ddl-auto}
spring.jpa.show-sql=${spring.jpa.show-sql}
spring.jpa.database-platform=${spring.jpa.database-platform}

# Logging configuration
logging.level.root=${logging.level.root}
logging.level.com.application=${logging.level.com.application}
logging.file.path=${logging.file.path}

# Actuator configuration
management.endpoints.web.exposure.include=${management.endpoints.web.exposure.include}
management.endpoint.health.show-details=${management.endpoint.health.show-details}

# Application-specific configuration
app.api.timeout=${app.api.timeout}
app.api.retry.count=${app.api.retry.count}
app.file.upload.path=${app.file.upload.path}
