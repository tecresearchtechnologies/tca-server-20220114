# Deprecated: moved to root vars/
# This file is intentionally left minimal to avoid classpath overrides.
# DO NOT PUT SENSITIVE VALUES HERE — use vars/secrets/prod-secrets.properties (git-ignored).
# Production defaults live in root vars/prod/values.properties

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging settings
logging.level.root=WARN
logging.level.com.application=INFO
logging.file.path=/var/logs

# Actuator settings
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Application-specific settings
app.api.timeout=60000
app.api.retry.count=5
app.file.upload.path=/var/uploads

# SSL/TLS paths (passwords in secrets)
server.ssl.key-store=file:/config/keystores/server-keystore.jks
server.ssl.trust-store=file:/config/keystores/server-truststore.jks

