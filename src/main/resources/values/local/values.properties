# Deprecated: moved to root vars/
# This file is intentionally left minimal to avoid classpath overrides.
# DO NOT PUT SENSITIVE VALUES HERE — use vars/secrets/local-secrets.properties (git-ignored).
# If you need local defaults keep them in root vars/local/values.properties

spring.datasource.username=postgres
spring.datasource.password=ps@admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# Logging settings
logging.level.root=INFO
logging.level.com.application=DEBUG
logging.file.path=logs

# Actuator settings
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Application-specific settings
app.api.timeout=30000
app.api.retry.count=3
app.file.upload.path=/tmp/uploads

